[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-ai"
version = "0.1.0"
description = "AI-driven data pipeline: collect -> clean -> transform -> store -> visualize"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "fishdick91" },
]
dependencies = [
    "pandas>=2.0",
    "duckdb>=0.9",
    "pyecharts>=2.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "SQLAlchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# 可选：结构化 HTML 清洗（基础包只含 parser，不下载浏览器）
scrape = ["scrapling>=0.5,<0.6"]
# 可选：完整 fetchers（TLS 指纹 / 隐身浏览器），装完还需执行 scrapling install
scrape-full = ["scrapling[fetchers]>=0.5,<0.6"]

[tool.setuptools.packages.find]
where = ["src"]
