[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-ai"
version = "0.1.0"
description = "AI-driven data pipeline: collect -> clean -> transform -> store -> visualize"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "fishdick91" },
]
dependencies = [
    "pandas>=2.0",
    "duckdb>=0.9",
    "pyecharts>=2.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "SQLAlchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]
